<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Broadcasting Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7B1C3E">
  
  <!-- โหลด YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7B1C3E',
            secondary: '#1B3A6B',
            background: '#F5F4F2',
          },
          fontFamily: {
            sans: ['Sukhumvit Set', 'Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'Sukhumvit Set';
      src: url('sukhumvit.ttf') format('truetype');
      font-display: swap;
    }

    body {
      background-color: #F5F4F2;
      background-image: radial-gradient(circle at 100% 0%, #F5E8ED 0%, transparent 40%),
                        radial-gradient(circle at 0% 100%, #EEF2F8 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* ซ่อน scrollbar แต่ยัง scroll ได้ */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0,0,0,0.2);
    }

    @keyframes slideIn { 
      from { opacity: 0; transform: translateX(-10px); } 
      to { opacity: 1; transform: translateX(0); } 
    }
    .animate-slide-in {
      animation: slideIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="h-screen overflow-hidden p-4 text-gray-800 flex gap-4">

  <!-- Audio Unlock Overlay -->
  <div id="audio-unlock-overlay" class="fixed inset-0 bg-gray-900/95 z-[10000] flex flex-col items-center justify-center text-white cursor-pointer backdrop-blur-md transition-opacity duration-500">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-32 h-32 mb-8 animate-bounce text-red-500"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>
    <h1 class="text-5xl font-black mb-4">คลิกหน้าจอเพื่อเริ่มระบบ</h1>
    <p class="text-2xl text-gray-300">เบราว์เซอร์จำเป็นต้องให้คุณกดยืนยัน 1 ครั้งเพื่อเปิดระบบเสียงอัตโนมัติ</p>
  </div>

  <!-- SOS Flashing Overlay -->
  <div id="sos-overlay" class="fixed inset-0 z-[9999] bg-red-600 hidden flex-col items-center justify-center animate-pulse">
    <h1 class="text-white text-6xl md:text-9xl font-black tracking-widest text-center" style="text-shadow: 0 0 20px rgba(0,0,0,0.5);">EMERGENCY</h1>
    <h2 id="sos-overlay-code" class="text-white text-4xl md:text-7xl font-bold mt-8 bg-black/30 px-12 py-6 rounded-3xl" style="text-shadow: 0 0 10px rgba(0,0,0,0.5);">CODE: -</h2>
  </div>

  <!-- LEFT PANE: Pickups -->
  <div class="w-1/2 flex flex-col bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-4 h-full">
    <div class="bg-primary text-white text-xl font-semibold text-center py-3 px-4 rounded-xl shadow-sm mb-4 shrink-0 flex items-center justify-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
      สถานะการรับนักเรียน
    </div>
    <div id="pickup-list" class="overflow-y-auto flex-grow pr-2 flex flex-col gap-3">
      <div class="text-center text-gray-400 mt-8 text-lg">กำลังเชื่อมต่อข้อมูล...</div>
    </div>
  </div>

  <!-- RIGHT PANE -->
  <div class="w-1/2 flex flex-col gap-4 h-full">
    
    <!-- Music Player -->
    <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-4 flex flex-col" style="height: 40%;">
      <div class="bg-red-600 text-white text-lg font-semibold text-center py-2 px-4 rounded-xl shadow-sm mb-3 shrink-0 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z" /></svg>
        ระบบจัดการเสียงดนตรี
      </div>
      <div class="flex gap-2 mb-2">
        <input type="text" id="yt-url" placeholder="วางลิงก์ YouTube ที่นี่..." class="flex-grow px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
        <button onclick="addMusicToQueue()" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg transition flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          เพิ่มรายการเพลง
        </button>
        <button onclick="skipMusic()" class="bg-orange-500 hover:bg-orange-600 text-white font-medium px-4 py-2 rounded-lg transition flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8.688c0-.864.933-1.405 1.683-.977l7.108 4.062a1.125 1.125 0 010 1.953l-7.108 4.062A1.125 1.125 0 013 16.81V8.688zM12.75 8.688c0-.864.933-1.405 1.683-.977l7.108 4.062a1.125 1.125 0 010 1.953l-7.108 4.062a1.125 1.125 0 01-1.683-.977V8.688z" /></svg>
          ข้าม (Skip)
        </button>
      </div>
      <div class="flex items-center gap-2 mb-3 text-sm text-gray-600">
        <input type="checkbox" id="override-bells" class="rounded text-primary focus:ring-primary"> 
        <label for="override-bells">ปลดล็อกระบบตัดเพลง (อนุญาตให้เพลงค่อยๆ หรี่และดับลงเมื่อมีประกาศหรือเสียงออด)</label>
      </div>
      <div id="music-queue" class="overflow-y-auto flex-grow text-sm flex flex-col gap-2"></div>
      
      <!-- Hidden YT Player -->
      <div id="yt-player-container" class="absolute w-0 h-0 overflow-hidden -left-[9999px]">
        <div id="yt-player"></div>
      </div>
    </div>

    <!-- Bell Schedule Mini Toggle -->
    <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-3 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-2 text-emerald-600 font-bold text-base">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
        ระบบเสียงออดอัตโนมัติ
      </div>
      <button onclick="toggleBellModal(true)" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-medium transition text-sm flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 110-9h.75c.704 0 1.402-.03 2.09-.09m0 9.18c.253.962.584 1.892.985 2.783.247.55.06 1.21-.463 1.511l-.657.38c-.551.318-1.26.117-1.527-.461a20.845 20.845 0 01-1.44-4.282m3.102.069a18.03 18.03 0 01-.59-4.59c0-1.586.205-3.124.59-4.59m0 9.18a23.848 23.848 0 018.835 2.535M10.34 6.66a23.847 23.847 0 008.835-2.535m0 0A23.74 23.74 0 0018.795 3m.38 1.125a23.91 23.91 0 011.014 5.395m-1.014 8.855c-.118.38-.245.754-.38 1.125m.38-1.125a23.91 23.91 0 001.014-5.395m0-3.46c.495.413.811 1.035.811 1.73 0 .695-.316 1.317-.811 1.73m0-3.46a24.347 24.347 0 010 3.46" /></svg>
        ตั้งค่าเวลาออด
      </button>
    </div>

    <!-- Announcements -->
    <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-4 flex flex-col flex-grow">
      <div class="bg-purple-600 text-white text-lg font-semibold text-center py-2 px-4 rounded-xl shadow-sm mb-3 shrink-0 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>
        ประวัติการประกาศข่าวสาร
      </div>
      <div id="announce-list" class="overflow-y-auto flex-grow flex flex-col gap-2"></div>
    </div>

  </div>

  <!-- Bell Schedule Modal -->
  <div id="bell-modal" class="fixed inset-0 bg-gray-900/60 z-[9900] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh] overflow-hidden">
      <!-- Modal Header -->
      <div class="bg-emerald-500 p-4 flex justify-between items-center text-white shrink-0">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
          ตั้งค่าตารางเวลาเสียงออด
        </h2>
        <button onclick="toggleBellModal(false)" class="text-white hover:text-gray-200 transition p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>

      <!-- Modal Body (List) -->
      <div id="bell-list" class="overflow-y-auto p-4 flex-grow flex flex-col gap-2 bg-gray-50 min-h-[250px]"></div>

      <!-- Modal Footer (Add Form) -->
      <div class="p-4 border-t border-gray-200 bg-white flex flex-col gap-3 shrink-0">
        <div class="flex gap-2 items-end">
          <div class="w-1/4">
            <label class="block text-sm text-gray-600 mb-1">เวลา</label>
            <input type="time" id="bell-time" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div class="w-3/4">
            <label class="block text-sm text-gray-600 mb-1">รูปแบบเหตุการณ์ (Preset)</label>
            <select id="bell-preset" onchange="handlePresetChange()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="custom">กำหนดเอง (Custom)</option>
              <option value="assembly">เข้าเรียน / เคารพธงชาติ (Morning Assembly)</option>
              <option value="change_period">เปลี่ยนคาบเรียน (Change Period)</option>
              <option value="lunch">พักรับประทานอาหารกลางวัน (Lunch Break)</option>
              <option value="end_lunch">หมดเวลาพัก / เข้าเรียนภาคบ่าย (End of Lunch Break)</option>
              <option value="dismissal">เลิกเรียน (School Dismissed)</option>
            </select>
          </div>
        </div>

        <!-- Period Input (Hidden by default) -->
        <div id="bell-period-container" class="hidden flex gap-2 items-center bg-emerald-50 p-3 rounded-lg border border-emerald-100">
          <span class="text-sm text-gray-700">หมดคาบที่</span>
          <input type="number" id="bell-period-current" min="1" max="10" value="1" oninput="updatePresetDesc()" class="w-16 px-2 py-1 border border-emerald-300 rounded-lg text-center font-medium bg-white outline-none focus:ring-2 focus:ring-emerald-500">
          <span class="text-sm text-gray-700">เตรียมเข้าคาบที่</span>
          <input type="number" id="bell-period-next" min="1" max="10" value="2" oninput="updatePresetDesc()" class="w-16 px-2 py-1 border border-emerald-300 rounded-lg text-center font-medium bg-white outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Custom Details Input -->
        <div id="bell-custom-container" class="flex flex-col gap-2">
          <div class="flex gap-2">
            <input type="text" id="bell-desc" placeholder="ประกาศ (ไทย) เช่น หมดเวลาเรียน" class="w-1/2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            <input type="text" id="bell-desc-en" placeholder="(อังกฤษ) เช่น Class dismissed" class="w-1/2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <select id="bell-sound" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="default">เสียงมาตรฐาน</option>
              <option value="start">เสียงเข้าเรียน</option>
              <option value="end">เสียงเลิกเรียน/เปลี่ยนคาบ</option>
            </select>
          </div>
        </div>

        <button id="bell-add-btn" onclick="addBell()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-4 py-2.5 rounded-lg transition flex justify-center items-center gap-2 mt-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          บันทึกเวลาออด
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden HTML5 Audio for TTS and Bells -->
  <audio id="main-player" class="hidden"></audio>
  <audio id="bell-player" class="hidden" src="https://assets.mixkit.co/active_storage/sfx/2042/2042-preview.mp3"></audio>
  <audio id="sos-player" class="hidden" src="./sounds/SOS_Alarm.mp3" loop></audio>

  <script>
    // ==========================================
    // ⚙️ Configurations & Global State
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyDmhCMyqQdnF3LdDSR_sFzCW3dj5C5Oh7D-ToR529Ij01nQLCjZM7Iqec6E_VqDlSGtg/exec"; 
    
    // Pickups
    let lastPickupString = "";
    let announcedNames = new Set(JSON.parse(sessionStorage.getItem('sv_announcedNames') || '[]'));
    let pendingAnnouncements = [];
    
    // Announcements
    let announcedIds = new Set(JSON.parse(sessionStorage.getItem('sv_announcedMsgs') || '[]'));

    // Audio / TTS
    const ttsCache = {};
    let audioQueue = [];
    let isPlayingTTS = false;
    let isPreparingAudio = false;
    const player = document.getElementById('main-player');

    // Unlock Audio on First Click
    document.getElementById('audio-unlock-overlay').addEventListener('click', function() {
      const p1 = document.getElementById('main-player');
      if(p1) { p1.play().catch(e=>{}); p1.pause(); p1.currentTime=0; }
      
      const p2 = document.getElementById('bell-player');
      if(p2) { p2.play().catch(e=>{}); p2.pause(); p2.currentTime=0; }
      
      const p3 = document.getElementById('sos-player');
      if(p3) { p3.play().catch(e=>{}); p3.pause(); p3.currentTime=0; }

      if (typeof ytPlayer !== 'undefined' && ytPlayer && typeof ytPlayer.playVideo === 'function') {
        ytPlayer.playVideo();
      }

      this.classList.add('opacity-0');
      setTimeout(() => this.classList.add('hidden'), 500);
    });

    // ==========================================
    // 1. YouTube Music Bot Logic
    // ==========================================
    let ytPlayer;
    let musicQueue = [];
    let currentMusicIndex = -1;
    let fadeInterval = null;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '100', width: '100',
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'rel': 0 },
        events: {
          'onReady': tryPlayMusic,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function tryPlayMusic() {
      if (!ytPlayer || typeof ytPlayer.loadVideoById !== 'function') return;
      
      let state = -1;
      if (typeof ytPlayer.getPlayerState === 'function') {
        state = ytPlayer.getPlayerState();
      }
      // If playing or buffering, do nothing
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) return;
      
      if (currentMusicIndex < 0) currentMusicIndex = 0;
      
      if (currentMusicIndex < musicQueue.length) {
        ytPlayer.loadVideoById(musicQueue[currentMusicIndex].id);
      }
      renderMusicQueue();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNextMusic();
      }
    }

    function extractVideoID(url) {
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      return (match && match[1]) ? match[1] : null;
    }

    async function fetchYouTubeTitle(vid) {
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vid}`);
        if (!res.ok) return `วิดีโอ ${vid}`;
        const data = await res.json();
        return data.title || `วิดีโอ ${vid}`;
      } catch(e) {
        return `วิดีโอ ${vid}`;
      }
    }

    async function addMusicToQueue() {
      const urlInput = document.getElementById('yt-url');
      const vid = extractVideoID(urlInput.value);
      if (!vid) return alert('ลิงก์ YouTube ไม่ถูกต้อง');
      urlInput.value = '';

      const title = await fetchYouTubeTitle(vid);
      musicQueue.push({ id: vid, url: 'https://youtu.be/'+vid, title: title });
      renderMusicQueue();
      tryPlayMusic();
    }

    function playNextMusic() {
      currentMusicIndex++;
      if (currentMusicIndex < musicQueue.length) {
        if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
          ytPlayer.loadVideoById(musicQueue[currentMusicIndex].id);
        }
      }
      renderMusicQueue();
    }

    function skipMusic() {
      playNextMusic();
    }

    function renderMusicQueue() {
      const qBox = document.getElementById('music-queue');
      qBox.innerHTML = musicQueue.map((item, idx) => {
        let isPlaying = (idx === currentMusicIndex);
        let isPlayed = (idx < currentMusicIndex);
        
        let classes = "px-3 py-2 rounded-lg flex justify-between items-center ";
        if (isPlaying) {
          classes += "bg-amber-100 border-l-4 border-amber-500 font-semibold text-amber-900";
        } else if (isPlayed) {
          classes += "bg-gray-100 text-gray-400 opacity-60";
        } else {
          classes += "bg-white border border-gray-100 shadow-sm";
        }

        const playIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 inline-block mr-1"><path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" /></svg>`;

        return `
          <div class="${classes}">
            <span class="truncate pr-2 flex items-center">${isPlaying ? playIcon : ''}${item.title || ('วิดีโอ ' + item.id)}</span>
            <span class="text-xs shrink-0 ${isPlayed ? '' : 'text-gray-400'}">${isPlayed ? 'เล่นแล้ว' : ''}</span>
          </div>
        `;
      }).join('');
      qBox.scrollTop = qBox.scrollHeight;
    }

    // --- Audio Ducking ---
    function duckMusicVolume(isDucking) {
      if (!ytPlayer || !ytPlayer.setVolume) return;
      clearInterval(fadeInterval);
      let vol = ytPlayer.getVolume();
      let target = isDucking ? 15 : 100;
      let step = isDucking ? -5 : 5;
      
      fadeInterval = setInterval(() => {
        vol += step;
        if ((isDucking && vol <= target) || (!isDucking && vol >= target)) {
          ytPlayer.setVolume(target);
          clearInterval(fadeInterval);
        } else {
          ytPlayer.setVolume(vol);
        }
      }, 50);
    }

    function stopMusicForBell() {
      if (ytPlayer && ytPlayer.stopVideo) {
        duckMusicVolume(true);
        setTimeout(() => ytPlayer.stopVideo(), 1000);
        // We do NOT clear the queue, we just skip to the end so it stops playing
        currentMusicIndex = musicQueue.length;
        renderMusicQueue();
      }
    }

    // ==========================================
    // 2. Bell Schedule System
    // ==========================================
    let bells = JSON.parse(localStorage.getItem('sv_bells') || '[]');
    let lastRungBell = null;
    let editBellIndex = -1;

    function renderBells() {
      bells.sort((a,b) => a.time.localeCompare(b.time));
      document.getElementById('bell-list').innerHTML = bells.map((b, idx) => {
        let soundName = 'มาตรฐาน';
        if (b.sound === 'start') soundName = 'เข้าเรียน';
        else if (b.sound === 'end') soundName = 'เลิกเรียน';
        
        return `
        <div class="flex justify-between items-center px-3 py-2 bg-white rounded-lg border border-gray-100 shadow-sm">
          <div class="flex flex-col">
            <span class="text-gray-700"><b>${b.time}</b> - ${b.desc}</span>
            ${b.descEn ? `<span class="text-sm text-gray-500 italic">${b.descEn}</span>` : ''}
            <span class="text-xs text-emerald-600 mt-1">🎵 เสียง: ${soundName}</span>
          </div>
          <div class="flex gap-2">
            <button onclick="editBell(${idx})" class="text-amber-500 hover:text-amber-600 transition" title="แก้ไข">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg>
            </button>
            <button onclick="removeBell(${idx})" class="text-red-500 hover:text-red-600 transition" title="ลบ">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
            </button>
          </div>
        </div>
        `
      }).join('');
    }

    function toggleBellModal(show) {
      const modal = document.getElementById('bell-modal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
        resetBellForm();
      }
    }

    function resetBellForm() {
      editBellIndex = -1;
      document.getElementById('bell-time').value = '';
      document.getElementById('bell-preset').value = 'custom';
      document.getElementById('bell-desc').value = '';
      document.getElementById('bell-desc-en').value = '';
      document.getElementById('bell-sound').value = 'default';
      document.getElementById('bell-add-btn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg> บันทึกเวลาออด';
      handlePresetChange();
    }

    function handlePresetChange() {
      const preset = document.getElementById('bell-preset').value;
      const customContainer = document.getElementById('bell-custom-container');
      const periodContainer = document.getElementById('bell-period-container');
      
      if (preset === 'custom') {
        customContainer.classList.remove('hidden');
        periodContainer.classList.add('hidden');
        periodContainer.classList.remove('flex');
      } else {
        customContainer.classList.add('hidden');
        if (preset === 'change_period') {
          periodContainer.classList.remove('hidden');
          periodContainer.classList.add('flex');
        } else {
          periodContainer.classList.add('hidden');
          periodContainer.classList.remove('flex');
        }
        updatePresetDesc();
      }
    }

    function updatePresetDesc() {
      const preset = document.getElementById('bell-preset').value;
      const descTh = document.getElementById('bell-desc');
      const descEn = document.getElementById('bell-desc-en');
      const sound = document.getElementById('bell-sound');

      if (preset === 'assembly') {
        descTh.value = 'ถึงเวลาเข้าแถวเคารพธงชาติ';
        descEn.value = "It's time for the morning assembly.";
        sound.value = 'start';
      } else if (preset === 'change_period') {
        const cur = document.getElementById('bell-period-current').value;
        const next = document.getElementById('bell-period-next').value;
        descTh.value = `หมดเวลาคาบเรียนที่ ${cur} เตรียมเข้าสู่คาบเรียนที่ ${next}`;
        descEn.value = `Period ${cur} is over. Please prepare for period ${next}.`;
        sound.value = 'end';
      } else if (preset === 'lunch') {
        descTh.value = 'หมดเวลาคาบเรียน พักรับประทานอาหารกลางวัน';
        descEn.value = 'It is now lunch break.';
        sound.value = 'end';
      } else if (preset === 'end_lunch') {
        descTh.value = 'หมดเวลาพักรับประทานอาหารกลางวัน เตรียมเข้าสู่คาบเรียน';
        descEn.value = 'Lunch break is over. Please prepare for classes.';
        sound.value = 'start';
      } else if (preset === 'dismissal') {
        descTh.value = 'หมดเวลาเรียน เลิกเรียน';
        descEn.value = 'Classes are dismissed for today.';
        sound.value = 'end';
      }
    }

    function addBell() {
      const time = document.getElementById('bell-time').value;
      const desc = document.getElementById('bell-desc').value;
      const descEn = document.getElementById('bell-desc-en').value;
      const sound = document.getElementById('bell-sound').value;
      const preset = document.getElementById('bell-preset').value;
      
      let pCur = null;
      let pNext = null;
      if(preset === 'change_period') {
         pCur = document.getElementById('bell-period-current').value;
         pNext = document.getElementById('bell-period-next').value;
      }

      if(time && desc) {
        if (editBellIndex > -1) {
          bells[editBellIndex] = {time, desc, descEn, sound, preset, pCur, pNext};
          editBellIndex = -1;
          document.getElementById('bell-add-btn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg> บันทึกเวลาออด';
        } else {
          bells.push({time, desc, descEn, sound, preset, pCur, pNext});
        }
        localStorage.setItem('sv_bells', JSON.stringify(bells));
        resetBellForm();
        renderBells();
      } else {
        alert("กรุณาระบุเวลาและรูปแบบให้ครบถ้วน");
      }
    }
    
    function editBell(idx) {
      editBellIndex = idx;
      const b = bells[idx];
      document.getElementById('bell-time').value = b.time;
      document.getElementById('bell-preset').value = b.preset || 'custom';
      
      if(b.preset === 'change_period') {
        document.getElementById('bell-period-current').value = b.pCur || 1;
        document.getElementById('bell-period-next').value = b.pNext || 2;
      }
      
      handlePresetChange();
      
      // Override desc and sound in case it was a custom setting
      document.getElementById('bell-desc').value = b.desc;
      document.getElementById('bell-desc-en').value = b.descEn || '';
      document.getElementById('bell-sound').value = b.sound || 'default';

      document.getElementById('bell-add-btn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" /></svg> บันทึกการแก้ไข';
    }

    function removeBell(idx) {
      bells.splice(idx, 1);
      localStorage.setItem('sv_bells', JSON.stringify(bells));
      renderBells();
    }

    function checkBells() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      
      // วันจันทร์ถึงวันศุกร์เท่านั้น (0 = อาทิตย์, 6 = เสาร์)
      if (dayOfWeek === 0 || dayOfWeek === 6) return;

      const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      
      const bell = bells.find(b => b.time === timeStr);
      if (bell && lastRungBell !== timeStr) {
        lastRungBell = timeStr;
        triggerBellSequence(bell);
      }
    }

    async function triggerBellSequence(bellObj) {
      const override = document.getElementById('override-bells').checked;
      if (!override) {
        stopMusicForBell();
      }

      let bellSoundUrl = "https://assets.mixkit.co/active_storage/sfx/2042/2042-preview.mp3";
      if (bellObj.sound === 'start') bellSoundUrl = encodeURI("./sounds/เข้าเรียน.mp3");
      else if (bellObj.sound === 'end') bellSoundUrl = encodeURI("./sounds/เลิกเรียน-เปลี่ยนคาบ.mp3");

      audioQueue.push(bellSoundUrl);

      // Parse time for English announcement
      const [h, m] = lastRungBell.split(':');
      let hourStr = parseInt(h);
      let ampm = hourStr >= 12 ? 'PM' : 'AM';
      let hour12 = hourStr % 12 || 12;
      let minStr = parseInt(m) === 0 ? "o'clock" : parseInt(m);
      
      const enTextDesc = bellObj.descEn ? bellObj.descEn : bellObj.desc;
      const txtEn = "The time is now " + hour12 + " " + minStr + " " + ampm + ", " + enTextDesc;
      const audioUrlEn = await fetchAudioData(txtEn, "en-GB");
      if(audioUrlEn) { audioQueue.push(audioUrlEn); }

      const txt = "ขณะนี้เวลา " + lastRungBell.replace(':', ' นาฬิกา ') + " นาที, " + bellObj.desc;
      const audioUrl = await fetchAudioData(txt, "th-TH");
      if(audioUrl) { audioQueue.push(audioUrl); }
      
      processAudioQueue();
    }

    // ==========================================
    // 3. Audio & TTS System (Pickups & Announce)
    // ==========================================
    async function fetchAudioData(text, lang) {
      const cleanText = String(text || '').trim();
      if (!cleanText) return null;
      const cacheKey = lang + ':' + cleanText;
      if (ttsCache[cacheKey]) return ttsCache[cacheKey];

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'tts_speak', text: cleanText, lang: lang })
        });
        const data = await response.json();
        if (data.success && data.audioContent) {
          const audioDataUri = 'data:audio/mp3;base64,' + data.audioContent;
          ttsCache[cacheKey] = audioDataUri;
          return audioDataUri;
        }
      } catch (e) { console.error('TTS Error:', e); }
      return null;
    }

    async function processAudioQueue() {
      if (isPlayingTTS) return;
      isPlayingTTS = true;
      duckMusicVolume(true);

      while (audioQueue.length > 0) {
        const audioSrc = audioQueue.shift();
        await new Promise(function(resolve) {
          player.src = audioSrc;
          player.onended = resolve;
          player.onerror = resolve;
          player.play().catch(function(e) {
            console.warn("Audio blocked:", e);
            if (e.name === 'NotAllowedError') {
              audioQueue.unshift(audioSrc);
              const unlock = () => { document.removeEventListener('click', unlock); resolve(); };
              document.addEventListener('click', unlock);
            } else resolve();
          });
        });
      }

      isPlayingTTS = false;
      duckMusicVolume(false);
    }

    async function queueStudentPickup(student) {
      const name = student.name;
      const gateThai = student.gate || "จุดรับนักเรียน";
      let gateEng = gateThai.includes("1") ? "Gate Number 1" : (gateThai.includes("3") ? "Gate Number 3" : "the pickup point");
      let nameForEng = name.replace(/ด\.ช\.|ด\.ญ\.|ดช\.|ดญ\.|เด็กชาย|เด็กหญิง/g, "").trim();
      let nameForThai = name.replace(/ด\.ช\.|ดช\./g, "เด็กชาย ").replace(/ด\.ญ\.|ดญ\./g, "เด็กหญิง ");

      const audios = await Promise.all([
        fetchAudioData("Attention please, student ", "en-GB"),
        fetchAudioData(nameForEng, "th-TH"),
        fetchAudioData(" please meet your parents at " + gateEng, "en-GB"),
        fetchAudioData(`ประกาศ, นักเรียนชื่อ ${nameForThai}, ขณะนี้ผู้ปกครองมารอรับแล้วที่ ${gateThai} ค่ะ`, "th-TH")
      ]);
      audios.forEach(a => { if(a) audioQueue.push(a); });
      processAudioQueue();
    }

    async function queueTeacherAnnouncement(item) {
      const audios = await Promise.all([
        fetchAudioData(item.en, "en-GB"),
        fetchAudioData(item.th, "th-TH")
      ]);
      audioQueue.push('./sounds/ประกาศ.mp3');
      audios.forEach(a => { if(a) audioQueue.push(a); });
      audioQueue.push('./sounds/ประกาศ.mp3');
      processAudioQueue();
    }

    // ==========================================
    // 4. Unified Polling Loop
    // ==========================================
    let isInitialLoad = true;

    function renderPickups(pickups) {
      if (!pickups || pickups.length === 0) {
        document.getElementById('pickup-list').innerHTML = '<div class="text-center text-gray-400 mt-8 text-lg">ไม่มีรายการนักเรียนรอรับกลับ...</div>';
        lastPickupString = "";
        return;
      }
      const html = pickups.map(item => `
        <div class="bg-white border-l-8 border-secondary rounded-xl p-4 shadow-sm flex justify-between items-center animate-slide-in">
          <div>
            <div class="text-2xl font-bold text-gray-800">${item.name}</div>
            <div class="text-secondary font-medium mt-1">${item.gate || 'จุดรับนักเรียน'}</div>
          </div>
          <span class="bg-secondary text-white px-4 py-1.5 rounded-full text-lg font-medium shadow-sm">${item.time} น.</span>
        </div>
      `).join('');
      
      if (html !== lastPickupString) {
        document.getElementById('pickup-list').innerHTML = html;
        lastPickupString = html;
        
        pickups.forEach(item => {
          const key = item.name + '_' + item.time;
          if (!announcedNames.has(key)) {
            announcedNames.add(key);
            sessionStorage.setItem('sv_announcedNames', JSON.stringify([...announcedNames]));
            if (!isInitialLoad) queueStudentPickup(item);
          }
        });
      }
    }

    function renderAnnouncements(announces) {
      if (!announces) return;
      const listDiv = document.getElementById('announce-list');
      announces.forEach(item => {
        if (!announcedIds.has(item.row)) {
          announcedIds.add(item.row);
          sessionStorage.setItem('sv_announcedMsgs', JSON.stringify([...announcedIds]));
          
          if (item.th.startsWith('#SOS#:')) {
            const sosCode = item.th.split(':')[1] || '';
            const div = document.createElement('div');
            div.className = 'p-3 bg-red-100 border border-red-500 rounded-lg shadow-sm animate-slide-in';
            div.innerHTML = `<div class="font-medium text-red-800 font-bold">🚨 สัญญาณเตือนภัยฉุกเฉิน (SOS Code: ${sosCode})</div>`;
            listDiv.prepend(div);
            
            if (!isInitialLoad) {
              const overlay = document.getElementById('sos-overlay');
              if (overlay) {
                document.getElementById('sos-overlay-code').innerText = "CODE: " + sosCode;
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
              }
              const sosPlayer = document.getElementById('sos-player');
              if (sosPlayer) {
                // Cut music entirely safely
                try {
                  if (typeof ytPlayer !== 'undefined' && ytPlayer && ytPlayer.stopVideo) {
                    ytPlayer.stopVideo();
                    currentMusicIndex = musicQueue.length;
                    renderMusicQueue();
                  }
                } catch(e) { console.warn('SOS YT Stop error:', e); }
                
                // Stop any current announcement/bell safely
                try {
                  if (typeof player !== 'undefined' && player) {
                    player.pause();
                  }
                } catch(e) { console.warn('SOS Player pause error:', e); }
                
                sosPlayer.play().catch(e => console.warn('SOS Play error:', e));
              }
              
              audioQueue = []; // Clear current queue to prioritize SOS
              isPlayingTTS = false; // Reset TTS state
              window.isSOSActive = true;
              
              fetchAudioData(`Emergency. SOS Code ${sosCode}.`, "en-GB").then(urlEn => {
                if (!window.isSOSActive) return;
                if (urlEn) audioQueue.push(urlEn);
                return fetchAudioData(`ประกาศเตือนภัยฉุกเฉิน. เอส โอ เอส โค้ด ${sosCode}`, "th-TH");
              }).then(urlTh => {
                if (!window.isSOSActive) return;
                if (urlTh) audioQueue.push(urlTh);
                processAudioQueue();
              }).catch(err => {
                console.error("SOS TTS failed:", err);
                if (window.isSOSActive) processAudioQueue();
              });
            }
            return;
          }
          if (item.th === '#STOP_SOS#') {
            const div = document.createElement('div');
            div.className = 'p-3 bg-gray-100 border border-gray-400 rounded-lg shadow-sm animate-slide-in';
            div.innerHTML = `<div class="font-medium text-gray-800 font-bold">🛑 ยกเลิกสัญญาณเตือนภัยฉุกเฉิน</div>`;
            listDiv.prepend(div);

            if (!isInitialLoad) {
              window.isSOSActive = false;

              const overlay = document.getElementById('sos-overlay');
              if (overlay) {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
              }
              const sosPlayer = document.getElementById('sos-player');
              if (sosPlayer) {
                sosPlayer.pause();
                sosPlayer.currentTime = 0;
              }
              
              if (typeof player !== 'undefined' && player) {
                player.pause();
              }
              audioQueue = [];
              isPlayingTTS = false;
              
              duckMusicVolume(false);
            }
            return;
          }
          
          const div = document.createElement('div');
          div.className = 'p-3 bg-white border border-gray-100 rounded-lg shadow-sm animate-slide-in';
          div.innerHTML = `<div class="font-medium text-gray-800">${item.th}</div><div class="text-gray-500 text-sm italic mt-1">${item.en}</div>`;
          listDiv.prepend(div);
          
          if (!isInitialLoad) queueTeacherAnnouncement(item);
        }
      });
    }

    function pollServer() {
      checkBells(); 

      fetch(API_URL + "?action=get_dashboard_data&t=" + new Date().getTime())
        .then(r => r.json())
        .then(async res => {
          if (res.success) {
            renderPickups(res.pickups);
            renderAnnouncements(res.announcements);
            
            // Handle Remote Music Queue
            if (res.musicQueue && res.musicQueue.length > 0) {
              for (const item of res.musicQueue) {
                if (item.videoId) {
                  if (!announcedIds.has('music_' + item.row)) {
                    announcedIds.add('music_' + item.row);
                    sessionStorage.setItem('sv_announcedMsgs', JSON.stringify([...announcedIds]));
                    
                    if (!isInitialLoad) {
                      const title = await fetchYouTubeTitle(item.videoId);
                      musicQueue.push({ id: item.videoId, url: 'https://youtu.be/' + item.videoId, title: title });
                      renderMusicQueue();
                      tryPlayMusic();
                    }
                  }
                }
              }
            }
          }
          isInitialLoad = false;
        }).catch(err => console.error(err));
    }

    // Init
    renderBells();
    pollServer();
    setInterval(pollServer, 8000);

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.error('Service Worker registration failed', err));
      });
    }

  </script>
