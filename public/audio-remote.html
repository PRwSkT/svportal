<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Control Panel - School Broadcasting Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7B1C3E',
            secondary: '#1B3A6B',
            background: '#F5F4F2',
          },
          fontFamily: {
            sans: ['Sukhumvit Set', 'Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style> 
    @font-face { font-family: 'Sukhumvit Set'; src: url('sukhumvit.ttf') format('truetype'); font-display: swap; }
    
    body {
      background-color: #F5F4F2;
      background-image: radial-gradient(circle at 100% 0%, #F5E8ED 0%, transparent 40%),
                        radial-gradient(circle at 0% 100%, #EEF2F8 0%, transparent 40%);
      background-attachment: fixed;
    }
    
    .is-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }
    .is-loading::after {
      content: "";
      position: absolute;
      left: calc(50% - 0.5em);
      top: calc(50% - 0.5em);
      width: 1em;
      height: 1em;
      border: 2px solid white;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen text-gray-800 p-4">
  <div class="max-w-xl mx-auto flex flex-col gap-5">
    
    <div id="app-section" class="flex flex-col gap-5">
      <!-- Header -->
      <div class="bg-primary text-white text-center py-4 px-6 rounded-2xl shadow-lg border border-white/20">
        <h1 class="text-xl font-semibold mb-1">ระบบควบคุมระยะไกล (Remote Control)</h1>
        <p class="text-sm opacity-90">ผู้ใช้งาน: <span id="user-display" class="font-medium text-amber-300">Admin</span></p>
      </div>

      <!-- Music Remote -->
      <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-5">
        <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-red-500"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z" /></svg>
          ระบบจัดการเสียงดนตรี
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์วิดีโอ YouTube</label>
          <input type="text" id="yt-url" placeholder="เช่น https://youtu.be/xxxxxxx" 
            class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
        </div>
        <button id="btn-add-music" onclick="addMusic()" 
          class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          เพิ่มรายการเพลง
        </button>
      </div>

      <!-- Announcement Remote -->
      <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-5">
        <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-secondary"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>
          ระบบประกาศข่าวสาร
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความประกาศ (ภาษาไทย)</label>
          <textarea id="announce-text" placeholder="พิมพ์ข้อความที่ต้องการให้ระบบอ่านออกเสียงประกาศ..." 
            class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition h-28 resize-none"></textarea>
        </div>
        <button id="btn-add-announce" onclick="addAnnouncement()" 
          class="w-full bg-secondary hover:bg-[#12274b] text-white font-medium py-2.5 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" /></svg>
          ส่งข้อความประกาศ
        </button>
      </div>
      </div>

      <!-- Emergency Remote -->
      <div class="bg-red-50 border border-red-200 rounded-2xl shadow-lg p-5">
        <h2 class="text-lg font-semibold mb-3 flex items-center gap-2 text-red-600">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
          ระบบเตือนภัยฉุกเฉิน
        </h2>
        <p class="text-sm text-gray-600 mb-4">กดปุ่มนี้เพื่อส่งสัญญาณเตือนภัยฉุกเฉิน (SOS Alarm) ไปยังลำโพงกลางทันที</p>
        <button id="btn-trigger-sos" onclick="triggerSOS()" 
          class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-lg shadow-sm transition flex justify-center items-center gap-2 mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
          เปิดสัญญาณเตือนภัย (SOS)
        </button>
        <button id="btn-stop-sos" onclick="stopSOS()" 
          class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          ยกเลิกสัญญาณเตือนภัย
        </button>
      </div>

      <button onclick="window.history.back()" 
        class="w-full mt-2 text-gray-500 hover:text-gray-800 font-medium py-2 transition">
        กลับสู่หน้าหลัก
      </button>
    </div>
  </div>

  <!-- SOS Keypad Modal -->
  <div id="sos-modal" class="fixed inset-0 bg-gray-900/95 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-3xl shadow-2xl p-6 w-[90%] max-w-sm border-2 border-red-500">
      <h3 class="text-center text-xl font-bold text-red-600 mb-2">🚨 ระบุรหัสฉุกเฉิน (SOS Code)</h3>
      <div class="text-center text-5xl font-mono font-bold tracking-widest text-red-600 h-16 bg-red-50 border border-red-200 rounded-xl flex items-center justify-center mb-6" id="sos-code-display">-</div>
      
      <div class="grid grid-cols-3 gap-3 mb-6">
        <button onclick="sosPad('1')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">1</button>
        <button onclick="sosPad('2')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">2</button>
        <button onclick="sosPad('3')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">3</button>
        <button onclick="sosPad('4')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">4</button>
        <button onclick="sosPad('5')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">5</button>
        <button onclick="sosPad('6')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">6</button>
        <button onclick="sosPad('7')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">7</button>
        <button onclick="sosPad('8')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">8</button>
        <button onclick="sosPad('9')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">9</button>
        <button onclick="sosPad('CLEAR')" class="h-16 text-lg font-bold text-red-500 bg-red-50 hover:bg-red-100 rounded-2xl active:bg-red-200 transition">ลบ</button>
        <button onclick="sosPad('0')" class="h-16 text-2xl font-bold bg-gray-100 hover:bg-gray-200 rounded-2xl active:bg-gray-300 transition">0</button>
        <button onclick="hideSosModal()" class="h-16 text-lg font-bold text-gray-500 bg-gray-50 hover:bg-gray-100 rounded-2xl active:bg-gray-200 transition">ยกเลิก</button>
      </div>

      <button id="btn-confirm-sos" onclick="confirmSosSend()" 
        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl text-xl shadow-lg flex justify-center items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        ส่งสัญญาณเตือนภัย
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyDmhCMyqQdnF3LdDSR_sFzCW3dj5C5Oh7D-ToR529Ij01nQLCjZM7Iqec6E_VqDlSGtg/exec"; 

    window.addEventListener('load', function() {
      document.getElementById('user-display').innerText = 'Admin (SVPortal)';
    });

    function extractVideoID(url) {
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      return (match && match[1]) ? match[1] : null;
    }

    function addMusic() {
      const input = document.getElementById('yt-url');
      const btn = document.getElementById('btn-add-music');
      const vid = extractVideoID(input.value);
      
      if (!vid) {
        alert('ลิงก์ YouTube ไม่ถูกต้อง');
        return;
      }

      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_music', videoId: vid })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          input.value = '';
          alert('เพิ่มลงในรายการเพลงเรียบร้อยแล้ว');
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }

    function addAnnouncement() {
      const input = document.getElementById('announce-text');
      const btn = document.getElementById('btn-add-announce');
      const text = input.value.trim();

      if (!text) {
        alert('กรุณาพิมพ์ข้อความที่ต้องการประกาศ');
        return;
      }

      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_announcement', text: text })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          input.value = '';
          alert('ส่งประกาศไปยังลำโพงเรียบร้อยแล้ว');
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }

    let currentSosCode = "";

    function triggerSOS() {
      currentSosCode = "";
      document.getElementById('sos-code-display').innerText = "-";
      document.getElementById('sos-modal').classList.remove('hidden');
    }

    function hideSosModal() {
      document.getElementById('sos-modal').classList.add('hidden');
    }

    function sosPad(val) {
      if (val === 'CLEAR') {
        currentSosCode = "";
      } else {
        if (currentSosCode.length < 4) {
          currentSosCode += val;
        }
      }
      document.getElementById('sos-code-display').innerText = currentSosCode || "-";
    }

    function confirmSosSend() {
      if (!currentSosCode) {
        alert("กรุณาระบุรหัสฉุกเฉินบนปุ่มกด");
        return;
      }
      if (!confirm(`ยืนยันการเปิดสัญญาณเตือนภัยฉุกเฉิน (SOS Code: ${currentSosCode}) ทั่วโรงเรียนใช่หรือไม่?`)) return;

      const btn = document.getElementById('btn-confirm-sos');
      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_announcement', text: '#SOS#:' + currentSosCode })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          hideSosModal();
          alert('ส่งสัญญาณเตือนภัยฉุกเฉินไปยังลำโพงเรียบร้อยแล้ว');
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }

    function stopSOS() {
      if (!confirm('ยืนยันการยกเลิก/หยุดสัญญาณเตือนภัยฉุกเฉิน?')) return;
      const btn = document.getElementById('btn-stop-sos');
      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_announcement', text: '#STOP_SOS#' })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          alert('ส่งคำสั่งยกเลิกสัญญาณเตือนภัยเรียบร้อยแล้ว');
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }
  </script>
</body>
</html>
