<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Control Panel - School Broadcasting Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style> 
    @font-face { font-family: 'MySukhumvit'; src: url('sukhumvit.ttf') format('truetype'); }
    body { background-color: #f4f6f8; padding: 20px; font-family: 'MySukhumvit', 'Kanit', sans-serif; min-height: 100vh; }
    .box { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .school-logo { max-width: 140px; height: auto; display: block; margin: 0 auto 15px auto; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 600px;">
    
    <div id="app-section">
      <div class="box" style="background: #173d66; color: white; text-align: center;">
        <h1 class="title is-4 has-text-white mb-2">แผงควบคุมระยะไกล</h1>
        <p class="is-size-6">ผู้ใช้งาน: <span id="user-display" class="has-text-warning"></span></p>
      </div>

      <!-- Music Remote -->
      <div class="box">
        <h2 class="title is-5"><i class="fas fa-music has-text-danger"></i> สั่งเปิดเพลง (YouTube)</h2>
        <div class="field">
          <label class="label">ลิงก์วิดีโอ YouTube</label>
          <div class="control">
            <input class="input" type="text" id="yt-url" placeholder="เช่น https://youtu.be/xxxxxxx">
          </div>
        </div>
        <button class="button is-danger is-fullwidth" id="btn-add-music" onclick="addMusic()">
          <i class="fas fa-play mr-2"></i> เพิ่มเข้าคิวเพลง
        </button>
      </div>

      <!-- Announcement Remote -->
      <div class="box">
        <h2 class="title is-5"><i class="fas fa-bullhorn has-text-link"></i> พิมพ์ข้อความประกาศ</h2>
        <div class="field">
          <label class="label">ข้อความภาษาไทย (ระบบจะแปลอิ้งให้เอง)</label>
          <div class="control">
            <textarea class="textarea" id="announce-text" placeholder="พิมพ์ข้อความที่ต้องการให้คอมพิวเตอร์กลางประกาศออกลำโพง..."></textarea>
          </div>
        </div>
        <button class="button is-link is-fullwidth" id="btn-add-announce" onclick="addAnnouncement()">
          <i class="fas fa-paper-plane mr-2"></i> ส่งข้อความประกาศ
        </button>
      </div>

      <button class="button is-text is-fullwidth mt-5" onclick="window.history.back()">กลับสู่หน้าหลัก</button>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyDmhCMyqQdnF3LdDSR_sFzCW3dj5C5Oh7D-ToR529Ij01nQLCjZM7Iqec6E_VqDlSGtg/exec"; 

    // ==========================================
    // 🚀 Init
    // ==========================================
    window.addEventListener('load', function() {
      document.getElementById('user-display').innerText = 'Admin (SVPortal)';
    });

    // ==========================================
    // 🎵 Remote Control Actions
    // ==========================================
    function extractVideoID(url) {
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      return (match && match[1]) ? match[1] : null;
    }

    function addMusic() {
      const input = document.getElementById('yt-url');
      const btn = document.getElementById('btn-add-music');
      const vid = extractVideoID(input.value);
      
      if (!vid) {
        alert('ลิงก์ YouTube ไม่ถูกต้อง');
        return;
      }

      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_music', videoId: vid })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          input.value = '';
          alert('✅ ส่งเข้าคิวเพลงเรียบร้อย');
        } else {
          alert('❌ เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }

    function addAnnouncement() {
      const input = document.getElementById('announce-text');
      const btn = document.getElementById('btn-add-announce');
      const text = input.value.trim();

      if (!text) {
        alert('กรุณาพิมพ์ข้อความ');
        return;
      }

      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_announcement', text: text })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          input.value = '';
          alert('✅ ส่งประกาศไปยังลำโพงเรียบร้อย');
        } else {
          alert('❌ เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }
  </script>
</body>
</html>
