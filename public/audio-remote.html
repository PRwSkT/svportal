<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Control Panel - School Broadcasting Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7B1C3E',
            secondary: '#1B3A6B',
            background: '#F5F4F2',
          },
          fontFamily: {
            sans: ['Sukhumvit Set', 'Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style> 
    @font-face { font-family: 'Sukhumvit Set'; src: url('sukhumvit.ttf') format('truetype'); font-display: swap; }
    
    body {
      background-color: #F5F4F2;
      background-image: radial-gradient(circle at 100% 0%, #F5E8ED 0%, transparent 40%),
                        radial-gradient(circle at 0% 100%, #EEF2F8 0%, transparent 40%);
      background-attachment: fixed;
    }
    
    /* Loading spinner animation */
    .is-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }
    .is-loading::after {
      content: "";
      position: absolute;
      left: calc(50% - 0.5em);
      top: calc(50% - 0.5em);
      width: 1em;
      height: 1em;
      border: 2px solid white;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen text-gray-800 p-4">
  <div class="max-w-xl mx-auto flex flex-col gap-5">
    
    <div id="app-section" class="flex flex-col gap-5">
      <!-- Header -->
      <div class="bg-primary text-white text-center py-4 px-6 rounded-2xl shadow-lg border border-white/20">
        <h1 class="text-xl font-semibold mb-1">แผงควบคุมระยะไกล</h1>
        <p class="text-sm opacity-90">ผู้ใช้งาน: <span id="user-display" class="font-medium text-amber-300">Admin</span></p>
      </div>

      <!-- Music Remote -->
      <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-5">
        <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
          <i class="fas fa-music text-red-500"></i> สั่งเปิดเพลง (YouTube)
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์วิดีโอ YouTube</label>
          <input type="text" id="yt-url" placeholder="เช่น https://youtu.be/xxxxxxx" 
            class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition">
        </div>
        <button id="btn-add-music" onclick="addMusic()" 
          class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
          <i class="fas fa-play"></i> เพิ่มเข้าคิวเพลง
        </button>
      </div>

      <!-- Announcement Remote -->
      <div class="bg-white/80 backdrop-blur-md border border-white rounded-2xl shadow-lg p-5">
        <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
          <i class="fas fa-bullhorn text-secondary"></i> พิมพ์ข้อความประกาศ
        </h2>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความภาษาไทย (ระบบจะแปลอิ้งให้เอง)</label>
          <textarea id="announce-text" placeholder="พิมพ์ข้อความที่ต้องการให้คอมพิวเตอร์กลางประกาศออกลำโพง..." 
            class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition h-28 resize-none"></textarea>
        </div>
        <button id="btn-add-announce" onclick="addAnnouncement()" 
          class="w-full bg-secondary hover:bg-[#12274b] text-white font-medium py-2.5 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
          <i class="fas fa-paper-plane"></i> ส่งข้อความประกาศ
        </button>
      </div>

      <button onclick="window.history.back()" 
        class="w-full mt-2 text-gray-500 hover:text-gray-800 font-medium py-2 transition">
        กลับสู่หน้าหลัก
      </button>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyDmhCMyqQdnF3LdDSR_sFzCW3dj5C5Oh7D-ToR529Ij01nQLCjZM7Iqec6E_VqDlSGtg/exec"; 

    // ==========================================
    // 🚀 Init
    // ==========================================
    window.addEventListener('load', function() {
      document.getElementById('user-display').innerText = 'Admin (SVPortal)';
    });

    // ==========================================
    // 🎵 Remote Control Actions
    // ==========================================
    function extractVideoID(url) {
      let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
      return (match && match[1]) ? match[1] : null;
    }

    function addMusic() {
      const input = document.getElementById('yt-url');
      const btn = document.getElementById('btn-add-music');
      const vid = extractVideoID(input.value);
      
      if (!vid) {
        alert('ลิงก์ YouTube ไม่ถูกต้อง');
        return;
      }

      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_music', videoId: vid })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          input.value = '';
          alert('✅ ส่งเข้าคิวเพลงเรียบร้อย');
        } else {
          alert('❌ เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }

    function addAnnouncement() {
      const input = document.getElementById('announce-text');
      const btn = document.getElementById('btn-add-announce');
      const text = input.value.trim();

      if (!text) {
        alert('กรุณาพิมพ์ข้อความ');
        return;
      }

      btn.classList.add('is-loading');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add_announcement', text: text })
      })
      .then(r => r.json())
      .then(res => {
        btn.classList.remove('is-loading');
        if (res.success) {
          input.value = '';
          alert('✅ ส่งประกาศไปยังลำโพงเรียบร้อย');
        } else {
          alert('❌ เกิดข้อผิดพลาด: ' + res.message);
        }
      })
      .catch(err => {
        btn.classList.remove('is-loading');
        alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
      });
    }
  </script>
</body>
</html>
